[package]
name = "squoosh"
version = "2.0.0"
description = "Squoosh - Image compression and optimization"
authors = ["Squoosh Contributors"]
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"

[lib]
name = "squoosh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri core and plugins
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
pollster = "0.3"

# Encoding
base64 = "0.22"

# GPU acceleration
wgpu = { version = "22.0", features = ["vulkan-portability"] }
bytemuck = { version = "1.14", features = ["derive"] }

# Image processing
image = { version = "0.25", features = ["jpeg", "png", "webp", "gif"] }
fast_image_resize = "4.0"

# Native codecs
imagequant = "4.0"
mozjpeg = "0.10"
oxipng = { version = "9.0", default-features = false, features = ["parallel", "zopfli"] }
webp = "0.3"
ravif = "0.11"
jxl-oxide = "0.8"
qoi = "0.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Platform-specific
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
